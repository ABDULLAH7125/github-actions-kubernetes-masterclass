apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ABDULLAH7125/github-actions-kubernetes-masterclass.git
    targetRevision: main
    path: k8s   # 👈 THIS is correct (not argocd folder)

  destination:
    server: https://kubernetes.default.svc
    namespace: skillpulse

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

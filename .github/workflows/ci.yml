name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**/*.md'

  workflow_dispatch:

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # Docker Login
      # =========================
      - name: Login to DockerHub
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # BACKEND BUILD
      # =========================
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          tags: |
            ${{ env.DOCKER_USER }}/skillpulse-backend:latest
            ${{ env.DOCKER_USER }}/skillpulse-backend:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================
      # FRONTEND BUILD
      # =========================
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          tags: |
            ${{ env.DOCKER_USER }}/skillpulse-frontend:latest
            ${{ env.DOCKER_USER }}/skillpulse-frontend:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

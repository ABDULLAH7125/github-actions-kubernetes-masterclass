name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  DOCKER_USER: abdullahgour
  BACKEND_IMAGE: abdullahgour/skillpulse-backend
  FRONTEND_IMAGE: abdullahgour/skillpulse-frontend

jobs:

  backend:
    name: Backend Build + Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  frontend:
    name: Frontend Build + Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  deploy:
    name: Deploy to Kubernetes
    needs:
      - backend
      - frontend

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Update Backend Image
        run: |
          kubectl set image deployment/backend \
          backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
          -n skillpulse

      - name: Update Frontend Image
        run: |
          kubectl set image deployment/frontend \
          frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
          -n skillpulse

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/backend -n skillpulse --timeout=120s
          kubectl rollout status deployment/frontend -n skillpulse --timeout=120s

      - name: Get Pods
        run: kubectl get pods -n skillpulse

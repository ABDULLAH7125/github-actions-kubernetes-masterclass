name: CD (deploy to Kubernetes)

on:
  workflow_run:
    workflows: ["CD (kind cluster — manifest bump)"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment backend
          kubectl rollout restart deployment frontend

name: CI-DevSecOps

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

# =========================
# SECURITY SCAN (DevSecOps)
# =========================
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🔐 Secret scanning
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

      # 🧠 Code vulnerability scan (SAST)
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@latest
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 1

      # 📦 Kubernetes manifest scan (if exists)
      - name: Trivy Config Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          severity: CRITICAL,HIGH
          exit-code: 1

# =========================
# BUILD & PUSH (Backend + Frontend)
# =========================
  build:
    runs-on: ubuntu-latest
    needs: security

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🐳 Build & Push Docker Image
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/skillpulse-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_USER }}/skillpulse-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 🔍 Image vulnerability scan
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.DOCKER_USER }}/skillpulse-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: 1

      # 📦 SBOM (Supply Chain Security)
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DOCKER_USER }}/skillpulse-${{ matrix.service }}:${{ env.IMAGE_TAG }}

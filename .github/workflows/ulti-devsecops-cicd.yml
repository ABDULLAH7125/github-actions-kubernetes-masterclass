name: Ultimate DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: devsecops-main
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_BACKEND: skillpulse-backend
  IMAGE_FRONTEND: skillpulse-frontend
  NAMESPACE: skillpulse

jobs:

# =========================
# CI + DEVSECOPS
# =========================
  ci-devsecops:
    name: CI + Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    outputs:
      sha: ${{ steps.vars.outputs.sha }}

    steps:
      # Checkout
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Variables
      - name: Set Variables
        id: vars
        run: |
          echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      # =========================
      # Backend Cache
      # =========================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # =========================
      # Frontend Cache
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # =========================
      # Install Trivy
      # =========================
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.0

      # =========================
      # Docker Login
      # =========================
      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # Buildx
      # =========================
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # Backend Build + Push
      # =========================
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================
      # Frontend Build + Push
      # =========================
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================
      # Trivy Filesystem Scan
      # =========================
      - name: Trivy Filesystem Scan
        run: |
          trivy fs . \
          --scanners vuln,secret,config \
          --severity HIGH,CRITICAL \
          --exit-code 0

      # =========================
      # Trivy Backend Image Scan
      # =========================
      - name: Scan Backend Image
        run: |
          trivy image \
          --severity HIGH,CRITICAL \
          --exit-code 0 \
          ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:${{ github.sha }}

      # =========================
      # Trivy Frontend Image Scan
      # =========================
      - name: Scan Frontend Image
        run: |
          trivy image \
          --severity HIGH,CRITICAL \
          --exit-code 0 \
          ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:${{ github.sha }}

      # =========================
      # Generate SBOM
      # =========================
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      # =========================
      # Upload SBOM
      # =========================
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

# =========================
# KUBERNETES CD
# =========================
  deploy:
    name: Kubernetes Deployment
    needs: ci-devsecops

    runs-on: self-hosted

    timeout-minutes: 10

    if: vars.DEPLOY_ENABLED == 'true'

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================
      # Verify Kubernetes
      # =========================
      - name: Verify Cluster
        run: |
          kubectl get nodes
          kubectl get ns

      # =========================
      # Deploy Backend
      # =========================
      - name: Update Backend Image
        run: |
          kubectl set image deployment/backend \
          backend=${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:${{ github.sha }} \
          -n ${NAMESPACE}

      # =========================
      # Deploy Frontend
      # =========================
      - name: Update Frontend Image
        run: |
          kubectl set image deployment/frontend \
          frontend=${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:${{ github.sha }} \
          -n ${NAMESPACE}

      # =========================
      # Rollout Status
      # =========================
      - name: Wait Backend Rollout
        run: |
          kubectl rollout status deployment/backend \
          -n ${NAMESPACE} \
          --timeout=120s

      - name: Wait Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend \
          -n ${NAMESPACE} \
          --timeout=120s

      # =========================
      # Verify Pods
      # =========================
      - name: Verify Pods
        run: |
          kubectl get pods -n ${NAMESPACE}
          kubectl get svc -n ${NAMESPACE}

      # =========================
      # Cleanup Docker
      # =========================
      - name: Cleanup Old Docker Images
        run: |
          docker image prune -af || true

# =========================
# OPTIONAL SECURITY JOBS
# =========================
  security-report:
    name: Security Report
    needs: ci-devsecops
    runs-on: ubuntu-latest

    steps:
      - name: Security Summary
        run: |
          echo "DevSecOps pipeline completed successfully"
          echo "Docker images scanned"
          echo "SBOM generated"
          echo "Kubernetes deployed securely"
